# The date ranges behind `api-vintage.yml` (M1-T11).
#
# `current_from` is when the API became available and `current_to` is when the library retired
# it, both from the release that changed it. Code calling the API was therefore written inside
# that window, which is what V03 brackets the knowledge cut-off with: the earliest `current_to`
# among the vintages a tree still uses is an upper bound on when its author's knowledge ends.
#
# `source` names where the date comes from, because a date invented here would silently move
# every window V03 reports. A maintainer correcting one only edits this file.

[[vintage]]
