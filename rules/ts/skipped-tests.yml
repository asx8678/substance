# T04 skipped and weak tests: TypeScript (M1-T09).
#
# The catalog's skip markers are `it.skip`, `test.skip`, `xit` and `describe.skip`. Each is a
# member call, so one pattern with a metavariable covers the first two and another covers the
# rest; the check reads the rule id to say which.
#
# A skip is not a lie on its own — a skipped test is often a known flake — so this is a hint,
# and the metric that matters is how many skips exist beside how many tests.

id: ts-skipped-test
language: ts
severity: hint
message: "skipped test"
metadata:
  check_id: T04
  sub_check: skip-marker
rule:
  any:
    - pattern: $SUITE.skip($$$ARGS)
    - pattern: xit($$$ARGS)
