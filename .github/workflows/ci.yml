# CI: the standard checks of docs/ACTION_PLAN.md §1 (M0-T09).
# No test steps: tests are excluded by ADR-0008.
# M1-T12 added the `dogfood` job and M3-T01 adds the `driver` job.
name: ci

# Quoted, so a YAML 1.1 parser (which reads a bare `on` as the boolean true)
# and GitHub's own parser agree on the trigger key.
"on":
  push:
  pull_request:

# Least privilege: every step only reads the repository.
permissions:
  contents: read

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `--locked` everywhere, so a stale Cargo.lock fails instead of being updated.
  CARGO_NET_RETRY: 3

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Pinned by commit: `git ls-remote https://github.com/actions/checkout refs/tags/v5.1.0`
      # prints fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (a lightweight tag, so no ^{} ref).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # `rust-toolchain.toml` pins the channel and its components; rustup installs
      # exactly that, so CI and a developer's machine use one compiler.
      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install --no-self-update
          rustc --version
          cargo --version
          rustup show active-toolchain

      # Ripgrep is what scripts/guards.sh searches with.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep

      # Pinned by commit: `git ls-remote https://github.com/actions/cache refs/tags/v4.3.0`
      # prints 0057852bfaa89a56745cba8c7296529d2fc39830 (a lightweight tag).
      # Only the registry and git caches are kept: `target/` changes too often to pay for.
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # C-RUST, verbatim from §1.
      - name: C-RUST
        run: cargo fmt --all -- --check && cargo clippy --workspace --all-targets --locked -- -D warnings && cargo build --workspace --locked

      # C-AGENT, verbatim from §1.
      - name: C-AGENT
        run: cargo clippy -p substance-agent --features agent --locked -- -D warnings

      # C-GUARD, verbatim from §1.
      - name: C-GUARD
        run: scripts/guards.sh

      # C-SCHEMA, verbatim from §1. The index equals HEAD here, so any uncommitted
      # drift in schemas/ or driver/src/generated/ fails the job.
      - name: C-SCHEMA
        run: cargo run -q -p substance-cli -- schema export --out schemas && git add -N schemas driver/src/generated && git diff --exit-code -- schemas driver/src/generated

  # M1-T12: substance evaluates substance. The job is deliberately narrow — triage only, and
  # `--fail-on none` — because its purpose is to prove the pipeline runs end to end in CI, not
  # to gate a merge on substance's own numbers. A failing verdict here would be a finding about
  # the tool, which belongs in an issue rather than in a red build.
  driver:
    name: driver
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned by commit: `git ls-remote https://github.com/actions/checkout refs/tags/v5.1.0`
      # prints fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 (a lightweight tag, so no ^{} ref).
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Pinned by commit: `git ls-remote https://github.com/actions/setup-node refs/tags/v6.0.0`
      # prints 2028fbc5c25fe9cf00d9f06a71cc4710d4507903 (a lightweight tag).
      # `driver/.nvmrc` is the version C-TS runs on, and the same file a developer's tools read.
      - name: Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: driver/.nvmrc
          cache: npm
          cache-dependency-path: driver/package-lock.json

      # C-TS verbatim: `npm ci` needs the committed lockfile, and the two scripts are the
      # checks. No browser is installed: the driver's own tests are excluded by ADR-0008, and
      # typechecking the Playwright API needs types, not a Chromium binary.
      - name: C-TS
        run: |
          npm --prefix driver ci
          npm --prefix driver run typecheck
          npm --prefix driver run lint

      # The build is a separate acceptance item (M3-T01); it proves the emitted `dist` is
      # loadable, which is what M3-T02 spawns.
      - name: Build
        run: npm --prefix driver run build

  dogfood:
    name: dogfood
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # `fetch-depth: 0` is not an optimisation to skip: triage reads commit history (H01–H22),
      # so a shallow clone would silently turn most of the history signals into `not_measured`.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Toolchain
        run: |
          rustup show active-toolchain || rustup toolchain install --no-self-update
          rustc --version

      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Only the tools with a confirmed pin in tools.toml are installed. A tool whose pin is
      # `TBD` (S01's three slop scanners) is left out on purpose: instructing CI to fetch
      # "latest" would let an unpinned release decide a verdict. Its checks then report
      # not_measured("tool missing"), which is the honest answer.
      - name: Install pinned triage tools
        run: |
          set -eu
          # gitleaks 8.30.1 (tools.toml; git ls-remote gitleaks/gitleaks refs/tags/v8.30.1)
          curl -fsSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
          gitleaks version

      - name: Build
        run: cargo build --locked -p substance-cli

      - name: substance run (triage only)
        run: ./target/debug/substance run --triage-only --fail-on none --format json,html .

      # `if: always()` so a run that exits non-zero still leaves its run directory behind:
      # the report is the evidence, and losing it would make a failed job undiagnosable.
      - name: Upload the run directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dogfood-run
          path: runs/
          if-no-files-found: warn
          retention-days: 7
