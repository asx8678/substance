[package]
name = "substance-adapters"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.92"
rusqlite = { version = "0.40.2", features = ["backup", "bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml_ng = "0.10.0"
substance-core = { version = "0.0.0", path = "../core" }
# The logical-decoding parsers: one place parses `wal2json` and `test_decoding` output, so this
# adapter and the recorder cannot disagree about what a change line means.
substance-recorder = { version = "0.0.0", path = "../recorder" }
substance-runner = { version = "0.0.0", path = "../runner" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["process", "time"] }
tokio-postgres = "0.7.18"
toml = "0.9"
tracing = "0.1.44"

[lints]
workspace = true
