[package]
name = "substance-recorder"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-core = { version = "0.0.0", path = "../core" }
substance-runner = { version = "0.0.0", path = "../runner" }
thiserror = "2.0.21"
# `io-util` for the buffered stdout reader, `process` and `sync` for the runner's spawn, `time`
# for the per-command deadline, `macros` and `rt` for the probes.
tokio = { version = "1.54.0", features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = "0.1.44"

[lints]
workspace = true
