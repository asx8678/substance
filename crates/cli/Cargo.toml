[package]
name = "substance-cli"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "substance"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-core = { version = "0.0.0", path = "../core" }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
panic = "deny"
dbg_macro = "deny"
