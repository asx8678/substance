[package]
name = "substance-core"
edition.workspace = true
publish.workspace = true

[dependencies]
data-encoding = "2.11.1"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["serde-compat"] }

[lints]
workspace = true
