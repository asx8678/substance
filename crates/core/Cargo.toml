[package]
name = "substance-core"
edition.workspace = true
publish.workspace = true

[dependencies]
data-encoding = "2.11.1"
rand_chacha = "0.10.0"
# `regex` compiles the normalization rules once; the patterns are restricted to the subset that
# JavaScript's RegExp reads identically, so the driver and this crate normalize the same way.
regex = "1.12.4"
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
toml = "1.1.8"
tracing = "0.1.44"
ts-rs = { version = "12.0.1", features = ["no-serde-warnings", "serde-compat"] }

[lints]
workspace = true
