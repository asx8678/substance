[package]
name = "substance-orchestrator"
edition.workspace = true
publish.workspace = true

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-core = { version = "0.0.0", path = "../core" }
substance-history = { version = "0.0.0", path = "../history" }
substance-report = { version = "0.0.0", path = "../report" }
substance-runner = { version = "0.0.0", path = "../runner" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true
