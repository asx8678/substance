[package]
name = "substance-orchestrator"
edition.workspace = true
publish.workspace = true

[dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-adapters = { version = "0.0.0", path = "../adapters" }
substance-core = { version = "0.0.0", path = "../core" }
substance-crawler = { version = "0.0.0", path = "../crawler" }
substance-history = { version = "0.0.0", path = "../history" }
substance-recorder = { version = "0.0.0", path = "../recorder" }
substance-report = { version = "0.0.0", path = "../report" }
substance-runner = { version = "0.0.0", path = "../runner" }
substance-statics = { version = "0.0.0", path = "../statics" }
thiserror = "2.0.21"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true
