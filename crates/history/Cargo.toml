[package]
name = "substance-history"
edition.workspace = true
publish.workspace = true

[dependencies]
async-trait = "0.1.83"
data-encoding = "2.11.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-core = { version = "0.0.0", path = "../core" }
substance-runner = { version = "0.0.0", path = "../runner" }
thiserror = "2.0.21"
time = { version = "0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.0", features = ["rt", "time"] }
tracing = "0.1.44"

[lints]
workspace = true
