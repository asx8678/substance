[package]
name = "substance-runner"
edition.workspace = true
publish.workspace = true

[dependencies]
http-body-util = "0.1.5"
hudsucker = { version = "0.25.0", features = ["http2"] }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
substance-core = { version = "0.0.0", path = "../core" }
thiserror = "2.0.21"
# `io-util` for the stream pumps, `rt` for the spawned readers, and `macros` for the probe's
# `#[tokio::main]`; the process supervisor needs all three. `signal` carries the Ctrl-C listener
# the interrupt module installs, and `sync` its broadcast channel.
tokio = { version = "1.54.0", features = [
    "io-util",
    "macros",
    "process",
    "rt",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.44"

# `killpg` and nothing else: `nix`'s `signal` feature is safe Rust over the POSIX call, so the
# workspace's `unsafe_code = forbid` stays intact and no `pre_exec` is needed.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[lints]
workspace = true
